<head>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="date" content="{{date}}">
  <meta name="keywords" content="events">
  <meta name="template" content="events">
  <meta name="location" content="{{location}}">
  <meta name="image" content="{{{image}}}">
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="hero">
        <div>
          <div>
            <picture>
              <img src="{{{image}}}" alt="{{title}}">
            </picture>
          </div>
        </div>
        <div>
          <div>
            <h1 id="{{id}}">{{title}}</h1>
          </div>
        </div>
      </div>
      <div class="columns">
        <div>
          <div>
            <p>{{description}}</p>
            {{#type}}<p>Type : {{type}}</p>{{/type}}
            <p>Date : {{date}}</p>
            {{#time}}<p>Time : {{time}}</p>{{/time}}
          </div>
        </div>
      </div>
      <div class="section-metadata">
        <div>
          <div>Style</div>
          <div>divider, align-center</div>
        </div>
      </div>
    </div>
    <div>
      <h2 id="other-events">Other Events</h2>
      <div class="cards dynamic carousel">
        <div>
          <div>keywords</div>
          <div>events</div>
        </div>
        <div>
          <div>excluded-keywords</div>
          <div>noindex</div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
