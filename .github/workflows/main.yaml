name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm install --prefix workers/cdn
    - run: npm install --prefix workers/usgs_quakes
    - run: npm install --prefix test
    - run: npm run lint
    - run: npm test --prefix workers/usgs_quakes
    - run: npm test --prefix test
