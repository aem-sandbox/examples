name = "gatefix-local"
main = "index.js"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[cache]
enabled = true

[exports.default]
type = "worker"

[exports.default.cache]
enabled = false

[exports.Anonymous]
type = "worker"

[exports.Anonymous.cache]
enabled = true

[vars]
ORIGIN_HOSTNAME = "main--examples--aem-sandbox.aem.live"
PUSH_INVALIDATION = "disabled"
GATED_CACHE_PATHS = "/gated-content"
